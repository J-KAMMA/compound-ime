# zenz v6 の練習問題を GitHub の上で作って確かめる（材料の取得もここで。手元には何も落とさない）。
# v5 の作り方（mix-data.yml）に、v6 の種類（同音語・固有名詞・打ち間違い・絵文字入りの話し言葉）と、
# 試験の文に「近い文」の除外（--near-exclusion）を足したもの。設定は finetune.ipynb ① と同じにしてある（変えるときは両方）。
#  1. 小さな規模（2万問）: 試験の文と、その1字を替えた「近い文」をわざと各出典に混ぜ、1文も残らないことを確かめる
#  2. 本番の規模（360万問）: Colab と同じ部品の分け方（text と wiki の2工程）で作り、除外と目録を確かめ、
#     部品ごとの SHA256 を v6-expected.json にまとめる（Colab ⑦が同じものを作れたかの照合に使う）
# 練習問題そのものは成果物に入れない（材料は配らない）。成果物は目録・件数・除いた文の例・SHA256・記録だけ。
name: v6 data

on:
  push:
    branches: ['work/v6-prep', 'exp/finetune-v6']
    paths: ['.github/workflows/v6-data.yml', 'tools/zenz-finetune/build_dataset.py', 'tools/zenz-finetune/mozc_lexicon.py']
  workflow_dispatch:
    inputs:
      small_size:
        description: 小さな規模の練習問題の数
        default: '20000'
      full_size:
        description: 本番の規模の練習問題の数（0 なら作らない）
        default: '3600000'

permissions:
  contents: read

env:
  SIZE_FULL: '3600000'
  # 出典の割合（finetune.ipynb ① の MIX と同じ）。v5 の 300万問の作り方をそのまま残し（元の材料の再生）、
  # v6 の 60万問（同音語 22万・固有名詞 13万・打ち間違い 20万・絵文字 5万）を足した割合
  MIX: wiki=0.6903,persona=0.1833,tatoeba=0.0225,domain=0.0833,synthetic=0.005,emoji=0.0139
  KINDS: wiki_whole=0.54,homophone=0.14,homophone_dict=0.125,proper_noun=0.074,typo_whole=0.114,casual=0.24,modern_words=0.32,english_phrases=0.17,business=0.07,counter=0.20,emoji_context=0.8,emoji_pick=0.2
  ORTHO: '0.8'
  PASSES: wiki=2,persona=3,tatoeba=3,domain=3,synthetic=1,emoji=2
  V6: --near-exclusion --typo-rate 0.12 --name-rate 0.5 --easy-homophone-rate 0.15
  WIKI_BASE: https://huggingface.co/datasets/wikimedia/wikipedia/resolve/b04c8d1ceb2f5cd4588862100d08de323dccfbaa/20231101.ja
  TOKENIZER_BASE: https://huggingface.co/Miwa-Keita/zenz-v3.1-small/resolve/344612e331bf3ba752a9bfef6633c93c6b933ebb
  MOZC_BASE: https://raw.githubusercontent.com/unok/mozc/2d993fd532c0df849ff3a5f6c7851b3757471ed6/src/data
  PYTHONUTF8: '1'

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - name: 道具
        run: |
          set -eo pipefail
          python3 -m venv venv && venv/bin/pip -q install "sudachipy==0.6.11" "sudachidict-core==20260428" "pyarrow==21.0.0" \
            "numpy" "transformers==4.57.6"
          venv/bin/python --version; nproc; free -g | head -2; df -h . | tail -1
      - name: 文書（分野の文書と RealPersonaChat。版を固定）
        run: venv/bin/python tools/zenz-finetune/fetch_domain_sources.py --out src
      - name: 材料（ウィキペディア 7 分割・ローマ字表・分かち方の部品・Tatoeba・Mozc の辞書と絵文字の表）
        run: |
          set -eo pipefail
          mkdir -p wiki tokenizer mozc
          # finetune.ipynb ① の WIKI_FILES と同じ（train-00003 と train-00011 は試験・選び手の材料なので入れない）
          for f in 00007:b112e83cf73327ba2246fd9c31eb1af501e51bac8450d8420963e29132d9b04b \
                   00004:16bfb8cfc7b53084fb0e76ebaf9e3ab8e82d775a045e7781f96494a2277e2dae \
                   00005:98fd014a7863168c5d23b8df3de874654bf1d858e5e67ffd003864ade5ae5723 \
                   00006:ea69e7a0ec68d5d3279a30820fb5bd496759daa32ec4f03146ff62a414ca5420 \
                   00008:859bb8856808e91d47cbf17f0c1ec5bfaf5ec8fb9f576c2f365bd49bda1daf7b \
                   00009:296ce0665517bbd706bbf42e97f520aa413870df35a2eab77eca07d70174ed0d \
                   00010:b13eb0cf6f28099844ba2d651cf429ad000eb1ba90bbb3243e9d22a92bef7eab; do
            n=${f%%:*}
            curl -fsSL --retry 3 -o wiki/train-$n-of-00015.parquet $WIKI_BASE/train-$n-of-00015.parquet
            echo "${f##*:}  wiki/train-$n-of-00015.parquet" | sha256sum -c
          done
          curl -fsSL -o romanji-hiragana.tsv $MOZC_BASE/preedit/romanji-hiragana.tsv
          echo "fcb900e311d32ced05499c86e236d1084fb0c0937398deb6311fc6c7287a7821  romanji-hiragana.tsv" | sha256sum -c
          # Mozc の辞書（同音語・固有名詞を選ぶ語の一覧に使う）と絵文字の表。finetune.ipynb ① の MOZC_DICT_FILES と同じ
          for f in dictionary00.txt:9e07ce292932c4fff327ed8cb06274c09acca556bd8bdf7c7ef1f6173eae3b61 \
                   dictionary01.txt:836fd5fd8399510de0d8ef7b33be913cca6bbaee7b712cc8045fba03f4c75a89 \
                   dictionary02.txt:93943858d0cfd092b849a78def6901eaf228177e1ac5663544e865a3a1e45a9e \
                   dictionary03.txt:cb9f1b0b4a7550d682d86244a021cd17e0b15366328819e69135b5f183a1a24b \
                   dictionary04.txt:9fdc4e3948d03463de13ab5782adffbc11dd06e934cb80138c5920029cd3d2f6 \
                   dictionary05.txt:199e3b0f050b691823ae7ba943090d437f51af6436b27c5f3dc69cafa12000e4 \
                   dictionary06.txt:b95b14f7770ae2a824bc8e9fad8b03c1bc45c504f93a36554b8b56daa0368d2a \
                   dictionary07.txt:7f53649b529d4c8c495d3a8dd9c4d489dfe7696080f7423107ff01331174be48 \
                   dictionary08.txt:50a31bb5fc1646721b00be371a5695dffab1292bda143e1e59cc70cbbdd8643f \
                   dictionary09.txt:4e5fcd4cbfbf11395166a37b506f547fc54d20edc0884f5184ecd3fc705f0d9a; do
            curl -fsSL --retry 3 -o mozc/${f%%:*} $MOZC_BASE/dictionary_oss/${f%%:*}
            echo "${f##*:}  mozc/${f%%:*}" | sha256sum -c
          done
          curl -fsSL -o mozc/emoji_data.tsv $MOZC_BASE/emoji/emoji_data.tsv
          echo "91e8d93f5e71b7fd821b30c8d72a7f5f22214fab5d8157d009600b304fe0cf08  mozc/emoji_data.tsv" | sha256sum -c
          venv/bin/python tools/zenz-finetune/mozc_lexicon.py --out lexicon.tsv mozc/dictionary0*.txt
          for f in vocab.json:67fd752abb091e649a9bb08bcb2b52b27cd6e3893ff5ee6e391e5555c0a90e0f \
                   merges.txt:dde8cf4cc72f4d6eb7461a1c7dde6847916f0ad405395238aaf67501e2803ca7 \
                   tokenizer_config.json:bd7ac21f1da24ee416971702ffdd9c8489f0327914a067c65561f59c142f848d \
                   special_tokens_map.json:f17f705b191ddb9aef0b42e40869d325d79b2a1e229e0d51d72698b5d3e4fc90; do
            curl -fsSL -o tokenizer/${f%%:*} $TOKENIZER_BASE/${f%%:*}
            echo "${f##*:}  tokenizer/${f%%:*}" | sha256sum -c
          done
          curl -fsSL -o jpn_sentences.tsv.bz2 https://downloads.tatoeba.org/exports/per_language/jpn/jpn_sentences.tsv.bz2
          echo "DUMP_SHA=$(sha256sum jpn_sentences.tsv.bz2 | cut -d' ' -f1)" >> $GITHUB_ENV
          MOD=$(curl -fsSL -I https://downloads.tatoeba.org/exports/per_language/jpn/jpn_sentences.tsv.bz2 | grep -i '^last-modified' | cut -d' ' -f2- | tr -d '\r')
          echo "DUMP_DATE=$(date -u -d "$MOD" +%F)" >> $GITHUB_ENV
      - name: 文を取り出す（分野・Tatoeba・RealPersonaChat）
        run: |
          set -eo pipefail
          mkdir -p text
          venv/bin/python tools/zenz-finetune/domain_text.py --src-root src --out text --only mdn python kubernetes react rust ethereum
          venv/bin/python tools/zenz-finetune/persona_text.py --src-root src --out text
          venv/bin/python tools/colloquial_text.py --tatoeba jpn_sentences.tsv.bz2 --table romanji-hiragana.tsv \
            --out-dir tatoeba --count 300 --dump-sha256 "$DUMP_SHA" --dump-date "$DUMP_DATE"
          cp tatoeba/colloquial-counts.json text/
          # 並びは Colab ⑦と同じ（分野 → RealPersonaChat → Tatoeba）。並びが違うと同じ問題にならない
          cat text/sentences.jsonl text/persona-train.jsonl tatoeba/colloquial-train.jsonl > text/all.jsonl
          wc -l text/all.jsonl
      - name: 1. 小さな規模（試験の文と近い文を混ぜて、除外が全部の出典に効くか）
        run: |
          set -eo pipefail
          venv/bin/python tools/zenz-finetune/check_dataset.py probe --out probe
          cat text/all.jsonl probe/probe-sentences.jsonl > text/all-probe.jsonl
          SIZE=${{ inputs.small_size || '20000' }}
          COMMON="--out small --romaji-table romanji-hiragana.tsv --domain-text text/all-probe.jsonl --mix $MIX --max-passes $PASSES --kind-weights $KINDS --ortho-share $ORTHO --size $SIZE --progress 5000 $V6 --lexicon lexicon.tsv --emoji-data mozc/emoji_data.tsv"
          WIKI="probe/probe-wiki.txt wiki/train-00007-of-00015.parquet"
          venv/bin/python tools/zenz-finetune/build_dataset.py $COMMON --only-source synthetic domain tatoeba persona emoji --part text --show 2
          venv/bin/python tools/zenz-finetune/build_dataset.py $COMMON --wiki $WIKI --only-source wiki --slice 0/2 --part wiki0 --show 2 & P0=$!
          venv/bin/python tools/zenz-finetune/build_dataset.py $COMMON --wiki $WIKI --only-source wiki --slice 1/2 --part wiki1
          wait $P0
          venv/bin/python tools/zenz-finetune/build_dataset.py --out small --merge-parts
          venv/bin/python tools/zenz-finetune/check_dataset.py verify --data small --romaji-table romanji-hiragana.tsv \
            --probe probe --expect-sources wiki,persona,tatoeba,domain,synthetic,emoji
      - name: 2. 本番の規模（Colab と同じ分け方。text と wiki の2工程。Colab ①の BUILD_PROCESSES = 2）
        run: |
          set -eo pipefail
          SIZE=${{ inputs.full_size || env.SIZE_FULL }}
          if [ "$SIZE" = "0" ]; then exit 0; fi
          COMMON="--out full --romaji-table romanji-hiragana.tsv --size $SIZE --seed 20261015 --mix $MIX --max-passes $PASSES --kind-weights $KINDS --ortho-share $ORTHO --progress 5000 $V6 --lexicon lexicon.tsv --emoji-data mozc/emoji_data.tsv"
          # 並びは finetune.ipynb ① の WIKI_FILES と同じ（並びが違うと同じ問題にならない）
          WIKI=""
          for n in 00007 00004 00005 00006 00008 00009 00010; do WIKI="$WIKI wiki/train-$n-of-00015.parquet"; done
          time venv/bin/python tools/zenz-finetune/build_dataset.py $COMMON --domain-text text/all.jsonl \
            --only-source synthetic domain tatoeba persona emoji --part text
          time venv/bin/python tools/zenz-finetune/build_dataset.py $COMMON --english-only-exact --wiki $WIKI \
            --only-source wiki --slice 0/2 --part wiki0of2 > full-wiki0.log 2>&1 & P0=$!
          time venv/bin/python tools/zenz-finetune/build_dataset.py $COMMON --english-only-exact --wiki $WIKI \
            --only-source wiki --slice 1/2 --part wiki1of2 > full-wiki1.log 2>&1
          wait $P0
          tail -n 5 full-wiki0.log; tail -n 5 full-wiki1.log
          venv/bin/python tools/zenz-finetune/build_dataset.py --out full --merge-parts
          du -sh full
      - name: 2b. 本番の規模の確かめ（除外・目録）、大きさと速さ、照合用の SHA256
        run: |
          set -eo pipefail
          if [ ! -f full/manifest.json ]; then exit 0; fi
          venv/bin/python tools/zenz-finetune/check_dataset.py verify --data full --romaji-table romanji-hiragana.tsv \
            --expect-sources wiki,persona,tatoeba,domain,synthetic,emoji
          venv/bin/python tools/zenz-finetune/measure_dataset.py --data full --tokenizer tokenizer
          venv/bin/python - <<'EOF'
          import json, hashlib
          m = json.load(open("full/manifest.json", encoding="utf-8"))
          sha = lambda p: hashlib.sha256(open(p, "rb").read()).hexdigest()
          out = {"repo_commit": m["repo_commit"], "counts": m["counts"],
                 "train_files": {f["name"]: f["sha256"] for f in m["train_files"]},
                 "valid": sha("full/valid.jsonl"), "lexicon": sha("lexicon.tsv"),
                 "sources": {s["name"]: s.get("sha256") for s in m["sources"] if s.get("sha256")}}
          json.dump(out, open("v6-expected.json", "w", encoding="utf-8"), ensure_ascii=False, indent=1)
          print(json.dumps(out, ensure_ascii=False, indent=1))
          EOF
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v6-data
          path: |
            small/*.json
            small/excluded*.txt
            full/*.json
            full/excluded*.txt
            full-wiki*.log
            text/*.json
            tatoeba/colloquial-counts.json
            probe/probe.json
            v6-expected.json
          retention-days: 14
