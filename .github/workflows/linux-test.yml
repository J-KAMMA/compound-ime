# Linux で組み立てて、変換の一括試験（1,298 文と正解つき 270 文）を流す。
# 実験用の枝（exp/…）への push か、手動で動く。結果は成果物として残る。
name: Linux test

on:
  push:
    branches: ['exp/**']
  workflow_dispatch:
    inputs:
      model_release:
        description: 人工知能を差し替えて比べるときの、下書きの配布ページの目印（例 model-ft-v1）。空なら公式の人工知能
        default: ''
      model_file:
        description: その配布ページのファイル名（例 zenz-v3.2-small-ft-v1-Q5_K_M.gguf）
        default: ''
      groups:
        description: 流す試験の組（JSON の配列。空なら全部。例 ["k"]）
        default: ''
  # 辞書の月1回の自動更新（dict-update.yml）から呼ぶ。dict_candidate に、署名つきの配布物を入れた成果物の名前を渡すと、
  # 試験の組ごとに「いまの辞書（base）」と「新しい辞書（cand）」の両方を流す（同じ変換エンジン）。結果は
  # linux-results（いまの辞書）と linux-results-cand（新しい辞書）。
  workflow_call:
    inputs:
      model_release:
        type: string
        default: ''
      model_file:
        type: string
        default: ''
      groups:
        type: string
        default: ''
      dict_candidate:
        type: string
        default: ''

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    env:
      USE_BAZEL_VERSION: 9.0.2
    steps:
      - uses: actions/checkout@v4
        with:
          path: repo

      - name: 道具
        run: |
          set -eo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang cmake ninja-build lld libcurl4-openssl-dev libncurses-dev libxml2-dev libz3-dev python3-venv > /dev/null
          mkdir -p $HOME/tools && ln -sf $(command -v ld.lld) $HOME/tools/ld.lld
          curl -fsSL -o $HOME/tools/bazelisk https://github.com/bazelbuild/bazelisk/releases/download/v1.25.0/bazelisk-linux-amd64
          chmod +x $HOME/tools/bazelisk
          curl -fsSL -o /tmp/swift.tar.gz https://download.swift.org/swift-6.3.3-release/ubuntu2404/swift-6.3.3-RELEASE/swift-6.3.3-RELEASE-ubuntu24.04.tar.gz
          mkdir -p $HOME/swift && tar -xzf /tmp/swift.tar.gz -C $HOME/swift --strip-components=1 && rm /tmp/swift.tar.gz
          $HOME/swift/usr/bin/swift --version

      # 辞書の更新の仕組みの単体試験（Mozc なし。数分。通信は手元の 127.0.0.1 だけ）。ここで落ちたら、長い組み立てに入らない
      - name: 辞書の更新の単体試験
        run: |
          set -eo pipefail
          python3 -m venv $GITHUB_WORKSPACE/venv-dict && $GITHUB_WORKSPACE/venv-dict/bin/pip -q install cryptography
          bash $GITHUB_WORKSPACE/repo/tools/run_dict_update_unit_tests.sh $GITHUB_WORKSPACE/venv-dict/bin/python $RUNNER_TEMP/dict-update-test
          python3 $GITHUB_WORKSPACE/repo/tools/test_dict_quality_gate.py

      - name: 上流のソースと土台の改修
        run: |
          set -eo pipefail
          W=$GITHUB_WORKSPACE
          git clone -q https://github.com/unok/myime.git myime
          git -C myime checkout -q a8486eca5312556ff88fed7f1850a28843b67977
          git -C myime submodule update -q --init --recursive
          git -C myime/mozc apply --whitespace=nowarn $W/repo/patches/mozc-base.patch
          git -C myime apply --whitespace=nowarn $W/repo/patches/myime-engine.patch
          git init -q llama.cpp && cd llama.cpp && git remote add origin https://github.com/fkunn1326/llama.cpp.git
          git fetch -q --depth 1 origin 10131b23ee0dbd9d03dfc618cec9fe3402919277 && git checkout -q FETCH_HEAD
          git apply --ignore-whitespace $W/repo/patches/llama-utf8.patch

      # 組み立ての途中の結果を次の試験で使い回す（変えた所だけ組み立て直す）
      - uses: actions/cache@v4
        with:
          path: |
            ~/bazel-disk
            ~/bazel-repo
          key: linux-bazel-${{ github.run_id }}
          restore-keys: linux-bazel-
      - uses: actions/cache@v4
        with:
          path: |
            llama.cpp/build
            myime/src/swift-engine/.build
          key: linux-engine-${{ hashFiles('repo/patches/llama-utf8.patch', 'repo/patches/myime-engine.patch', 'repo/tools/apply_linux_engine_port.py', 'repo/tools/apply_selector_trace.py', 'repo/tools/apply_selector_stage3.py', 'repo/tools/apply_zenzai_deadline.py', 'repo/tools/apply_context_gate.py', 'repo/tools/apply_batch_score.py', 'repo/tools/apply_latency_profile.py', 'repo/tools/swift-Package.resolved') }}

      - name: 生成器と改造の適用
        run: |
          set -eo pipefail
          W=$GITHUB_WORKSPACE; S=$W/myime/mozc/src
          python3 -m venv $W/venv && $W/venv/bin/pip -q install pillow
          PY=$W/venv/bin/python
          $PY $W/repo/tools/build_english_lexicon.py --out $W/lex
          mkdir -p $W/ut
          curl -fsSL -o $W/ut/mozcdic-ut-sudachidict.txt.bz2 \
            https://raw.githubusercontent.com/utuhiro78/mozcdic-ut-sudachidict/c686771bada1d59e9b105c81b29e6ac1a239cb54/mozcdic-ut-sudachidict.txt.bz2
          echo "d2cb4b2b16d513e257d26d1c33673ebda254a1d5aa0c3c0c9bc94f932619fbdc  $W/ut/mozcdic-ut-sudachidict.txt.bz2" | sha256sum -c
          bunzip2 -k $W/ut/mozcdic-ut-sudachidict.txt.bz2
          $PY $W/repo/tools/build_ut_dictionary.py --mozc $S --ut $W/ut --sources sudachidict --out $W/dictionary10.txt --install
          cp $W/repo/native/precision117/engine.cc $S/engine/engine.cc
          cp $W/repo/native/precision117/whole_surface_path_v2.h $S/engine/whole_surface_path_v2.h
          $PY $W/repo/tools/apply_jaen_integration.py $S $W/lex
          $PY $W/repo/tools/apply_decimal_point.py $S
          $PY $W/repo/tools/decimal_transform_test.py $S
          # 辞書の更新（配布ページから辞書だけを取りに行く仕組み。docs/dict-update.md）
          $PY $W/repo/tools/apply_dict_update.py $S
          $PY $W/repo/tools/apply_linux_engine_port.py $W/myime/src
          # 選び手の段階2b: Zenzai の計算済みの分布の記録（MYIME_SELECTOR_FEATURES のときだけ動く）
          $PY $W/repo/tools/apply_selector_trace.py $W/myime/src
          # 選び手の段階3: 学習した選び手を組み込む（MYIME_SELECTOR=0 で切る）
          $PY $W/repo/tools/apply_selector_stage3.py $S $W/myime/src
          # 前後の文での並べ替えを迷うときだけにする門（MYIME_CTX_TOPK、MYIME_CTX_GAP で値を比べられる）
          $PY $W/repo/tools/apply_context_gate.py $W/myime/src
          # 候補の採点を、候補を全部まとめた1回の評価にする（MYIME_BATCH_SCORE=0 で順の採点に戻せる）
          $PY $W/repo/tools/apply_batch_score.py $W/myime/src
          # 変換1回の時間を段ごとに測る仕組み（MYIME_PROFILE のときだけ動く。普段の変換結果は変わらない）
          $PY $W/repo/tools/apply_latency_profile.py $S $W/myime/src

      - name: llama.cpp と変換エンジン
        run: |
          set -eo pipefail
          W=$GITHUB_WORKSPACE; export PATH=$HOME/swift/usr/bin:$PATH
          cmake -S $W/llama.cpp -B $W/llama.cpp/build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=ON \
            -DGGML_NATIVE=OFF -DGGML_AVX2=ON -DGGML_FMA=ON -DGGML_F16C=ON -DLLAMA_CURL=OFF \
            -DLLAMA_BUILD_TESTS=OFF -DLLAMA_BUILD_EXAMPLES=OFF -DLLAMA_BUILD_SERVER=OFF > /dev/null
          cmake --build $W/llama.cpp/build > /dev/null
          cd $W/myime/src/swift-engine
          cp $W/repo/tools/swift-Package.resolved Package.resolved
          L=$W/llama.cpp/build/bin
          swift build -c release -Xlinker -L$L -Xlinker -lllama -Xlinker -lggml -Xlinker -lggml-base \
            -Xlinker -rpath -Xlinker '$ORIGIN' -Xswiftc -no-toolchain-stdlib-rpath > $W/swift-build.log 2>&1 || { grep -B3 -A12 "error:" $W/swift-build.log | head -100; tail -5 $W/swift-build.log; exit 1; }; tail -3 $W/swift-build.log

      - name: Mozc（試験用ツール）
        run: |
          set -eo pipefail
          T=$HOME/tools; cd $GITHUB_WORKSPACE/myime/mozc/src
          $T/bazelisk build --config oss_linux -c opt --nocheck_visibility --disk_cache=$HOME/bazel-disk --repository_cache=$HOME/bazel-repo \
            --action_env=PATH=$T:/usr/bin:/bin --host_action_env=PATH=$T:/usr/bin:/bin \
            --linkopt=-B$T --host_linkopt=-B$T //session:session_handler_main > $GITHUB_WORKSPACE/bazel.log 2>&1 \
            || { grep -B3 -A20 "ERROR\|error:" $GITHUB_WORKSPACE/bazel.log | head -80; exit 1; }

      - name: 試験に使う一式をまとめる
        run: |
          set -eo pipefail
          W=$GITHUB_WORKSPACE; E=$W/bin/engine; mkdir -p $E
          R=$W/myime/src/swift-engine/.build/release
          cp $R/libazookey-engine.so $W/llama.cpp/build/bin/*.so $HOME/swift/usr/lib/swift/linux/*.so $E/
          cp -r $R/*.resources $E/
          cp $W/myime/mozc/src/bazel-bin/session/session_handler_main $E/

      - uses: actions/upload-artifact@v4
        with:
          name: linux-bin
          path: bin/
          retention-days: 1

      # 英単語の一覧（build_english_lexicon.py の出力）: ウィンドウズ版を手元で組み立てるときに使う
      - uses: actions/upload-artifact@v4
        with:
          name: english-lexicon
          path: lex/
          retention-days: 14

  # 選び手の段階2の材料集め（selector-data.yml）。exp/selector-stage2 の枝のときだけ。
  selector-data:
    needs: build
    if: github.ref_name == 'exp/selector-stage2'
    uses: ./.github/workflows/selector-data.yml
    permissions:
      contents: write
    with:
      model_release: ${{ inputs.model_release }}
      model_file: ${{ inputs.model_file }}

  # 試験を3つの組に分けて、別々の計算機で同時に流す（tools/run_tests.sh）
  # 選び手の材料集めの枝では、計算機を材料集めに回すため流さない。
  test:
    needs: build
    if: github.ref_name != 'exp/selector-stage2'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    # 下書きの配布ページ（公開しない、比べるための人工知能）を読むのに書き込みの権限が要る
    permissions:
      contents: write
    strategy:
      fail-fast: false
      max-parallel: 16
      matrix:
        group: ${{ fromJSON(inputs.groups || '["a1","a2","b","c","d1","d2","e1","e2","f","g","h","i","j","k","m","n","p","q","r","s","u"]') }}
        # dict_candidate があるときだけ、新しい辞書（cand）でも流す
        variant: ${{ fromJSON(inputs.dict_candidate && '["base","cand"]' || '["base"]') }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: repo
      - uses: actions/download-artifact@v4
        with:
          name: linux-bin
          path: bin
      - uses: actions/download-artifact@v4
        if: matrix.variant == 'cand'
        with:
          name: ${{ inputs.dict_candidate }}
          path: dict-candidate
      - name: 変換の試験（組 ${{ matrix.group }}、${{ matrix.variant == 'cand' && '新しい辞書' || 'いまの辞書' }}）
        env:
          GH_TOKEN: ${{ github.token }}
          DICT_CANDIDATE_DIR: ${{ matrix.variant == 'cand' && format('{0}/dict-candidate', github.workspace) || '' }}
        run: |
          set -eo pipefail
          W=$GITHUB_WORKSPACE
          chmod +x $W/bin/engine/session_handler_main
          if [ -n "${{ inputs.model_release }}" ]; then
            # 比べるための人工知能（公開しない下書きの配布ページから）
            gh release download "${{ inputs.model_release }}" -R "$GITHUB_REPOSITORY" -p "${{ inputs.model_file }}" -O $W/model.gguf
            echo "差し替えた人工知能: ${{ inputs.model_file }}"
            sha256sum $W/model.gguf
          else
            curl -fsSL -o $W/model.gguf \
              https://github.com/J-KAMMA/compound-ime/releases/download/model-zenz-ft-v5/zenz-v3.2-small-ft-v5-mix-Q5_K_M.gguf
            echo "2f9d9d9679dbd3b38ebd48f402369cc1c66f709bfcf83d70d87ca3353e541fff  $W/model.gguf" | sha256sum -c
          fi
          bash $W/repo/tools/run_tests.sh ${{ matrix.group }} $W/bin/engine $W/model.gguf $W/repo $W/results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ matrix.variant == 'cand' && format('cand-{0}', matrix.group) || format('results-{0}', matrix.group) }}
          path: results/
          if-no-files-found: ignore

  # 組の結果を1つにまとめる（名前は今までと同じ linux-results）
  results:
    needs: test
    if: always()
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJSON(inputs.dict_candidate && '["base","cand"]' || '["base"]') }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: repo
      - uses: actions/download-artifact@v4
        with:
          pattern: ${{ matrix.variant == 'cand' && 'cand-*' || 'results-*' }}
          path: results
          merge-multiple: true
      - name: 1,298文と打ち方の揺れの前半と後半をつなぐ
        run: |
          if [ -f results/inputs-1.tsv ] && [ -f results/inputs-2.tsv ]; then
            cat results/inputs-1.tsv results/inputs-2.tsv > results/inputs.tsv && rm results/inputs-1.tsv results/inputs-2.tsv
          fi
          if [ -f results/variants-1.tsv ] && [ -f results/variants-2.tsv ]; then
            cat results/variants-1.tsv results/variants-2.tsv > results/variants.tsv && rm results/variants-1.tsv results/variants-2.tsv
            python3 repo/tools/score_variants.py repo/tests/conversion/variants.tsv results/variants.tsv | tee results/variants-score.txt | head -40
          fi
          # 選び手の段階0: 候補の上位8つから正解を組める間違いの数（tools/selector_ceiling.py）
          if ls results/dump-*.txt > /dev/null 2>&1; then
            curl -fsSL -o romanji-hiragana.tsv \
              https://raw.githubusercontent.com/unok/mozc/2d993fd532c0df849ff3a5f6c7851b3757471ed6/src/data/preedit/romanji-hiragana.tsv
            echo "fcb900e311d32ced05499c86e236d1084fb0c0937398deb6311fc6c7287a7821  romanji-hiragana.tsv" | sha256sum -c
            for n in ja400 jaen270 jaen200b; do
              [ -f results/dump-$n.txt ] && python3 repo/tools/selector_ceiling.py results/dump-$n.txt results/$n.tsv \
                repo/tests/conversion/$n.json romanji-hiragana.tsv > results/ceiling-$n.txt && head -14 results/ceiling-$n.txt
            done
          fi
          # 選び手の段階1: Zenz の尤度だけで選べるか（tools/selector_stage1.py）
          for n in ja400 jaen200b; do
            [ -f results/score-$n.txt ] && python3 repo/tools/selector_stage1.py results/score-$n.txt results/$n.tsv \
              repo/tests/conversion/$n.json > results/stage1-$n.txt && head -8 results/stage1-$n.txt
          done
          if [ -f results/wiki-typing-1.tsv ] && [ -f results/wiki-typing-2.tsv ]; then
            cat results/wiki-typing-1.tsv results/wiki-typing-2.tsv > results/wiki-typing.tsv && rm results/wiki-typing-1.tsv results/wiki-typing-2.tsv
            python3 repo/tools/score_wiki_typing.py repo/tests/conversion/wiki-typing.tsv results/wiki-typing.tsv | tee results/wiki-typing-score.txt | head -40
          fi
          # 分野の打ち込み試験（プログラミング、仮想通貨）の採点
          for f in prog crypto tools; do
            if [ -f results/domain-$f.tsv ] && [ -f repo/tests/conversion/domain-$f.tsv ]; then
              case $f in prog) label="分野の打ち込み（プログラミング）";; tools) label="分野の打ち込み（開発の道具の名前）";; *) label="分野の打ち込み（仮想通貨）";; esac
              python3 repo/tools/score_wiki_typing.py repo/tests/conversion/domain-$f.tsv results/domain-$f.tsv "$label" > results/domain-$f-score.txt
              head -40 results/domain-$f-score.txt
            fi
          done
          # 大文字で始まる英字の固有名詞の試験（組 k）の採点
          if [ -f results/proper-nouns.tsv ] && [ -f repo/tests/conversion/proper-nouns.tsv ]; then
            python3 repo/tools/score_proper_nouns.py sentences repo/tests/conversion/proper-nouns.tsv results/proper-nouns.tsv "固有名詞の文" > results/proper-nouns-score.txt
            head -14 results/proper-nouns-score.txt
          fi
          if [ -f results/proper-nouns-cand.tsv ] && [ -f repo/tests/conversion/proper-nouns-cand.tsv ]; then
            python3 repo/tools/score_proper_nouns.py candidates repo/tests/conversion/proper-nouns-cand.tsv results/proper-nouns-cand.tsv "固有名詞の候補" > results/proper-nouns-cand-score.txt
            head -26 results/proper-nouns-cand-score.txt
          fi
          # 英単語と重なるローマ字（組 m）の採点: 既定の版、止めた版（off）、その差
          for f in mixed ja; do
            if [ -f results/allenglish-$f.tsv ] && [ -f repo/tests/conversion/allenglish-$f.tsv ]; then
              python3 repo/tools/score_allenglish.py $f repo/tests/conversion/allenglish-$f.tsv results/allenglish-$f.tsv > results/allenglish-$f-score.txt
              head -60 results/allenglish-$f-score.txt
              if [ -f results/allenglish-$f-off.tsv ]; then
                python3 repo/tools/score_allenglish.py $f repo/tests/conversion/allenglish-$f.tsv results/allenglish-$f-off.tsv "止めた版（MYIME_ALL_ENGLISH=off）" | head -8
                python3 repo/tools/score_allenglish.py compare $f repo/tests/conversion/allenglish-$f.tsv results/allenglish-$f-off.tsv results/allenglish-$f.tsv | tail -30
              fi
            fi
          done
          # 英語の文を1語ずつ確定しながら打つ場面（組 n）の採点: 既定の版と止めた版（MYIME_ENGLISH_FOLLOW=off）を並べる
          for f in word history ja control bare; do
            if [ -f results/english-follow-$f.tsv ] && [ -f repo/tests/conversion/english-follow-$f.tsv ]; then
              off=; [ -f results/english-follow-$f-off.tsv ] && off=results/english-follow-$f-off.tsv
              python3 repo/tools/score_english_follow.py $f repo/tests/conversion/english-follow-$f.tsv results/english-follow-$f.tsv $off > results/english-follow-$f-score.txt || true
              head -40 results/english-follow-$f-score.txt
            fi
          done
          # session の記憶の試験（組 n）: 残る場面は英語の1語になった数、捨てる場面は止めた版と同じか。expire は覚える時間を 3 秒に縮めたもの
          for f in memory expire; do
            if [ -f results/english-follow-$f.tsv ] && [ -f results/english-follow-$f-off.tsv ] && [ -f repo/tests/conversion/english-follow-$f.tsv ]; then
              python3 repo/tools/score_english_follow.py memory repo/tests/conversion/english-follow-$f.tsv results/english-follow-$f.tsv results/english-follow-$f-off.tsv > results/english-follow-$f-score.txt || true
              echo "== $f"; head -40 results/english-follow-$f-score.txt
            fi
          done
          if [ -f results/english-follow-cause.tsv ] && [ -f results/english-follow-cause-off.tsv ]; then
            python3 repo/tools/score_english_follow.py cause repo/tests/conversion/english-follow-cause.tsv results/english-follow-cause.tsv results/english-follow-cause-off.tsv > results/english-follow-cause-score.txt || true
            echo "== cause"; cat results/english-follow-cause-score.txt
          fi
          # 開発の道具の名前の候補（組 q）の採点と、F10・Shift の記録
          if [ -f results/domain-tools-cand.tsv ] && [ -f repo/tests/conversion/domain-tools-cand.tsv ]; then
            python3 repo/tools/score_proper_nouns.py candidates repo/tests/conversion/domain-tools-cand.tsv results/domain-tools-cand.tsv "開発の道具の候補" > results/domain-tools-cand-score.txt
            head -30 results/domain-tools-cand-score.txt
          fi
          [ -f results/tools-keys.txt ] && cat results/tools-keys.txt
          # 小文字で打たれやすい英字の略語の試験（組 r）の採点。文は「名前が合う」が略語の書き方（AI）が出た数、日本語の語が重なる文は「名前が合う」が日本語のまま出た数
          if [ -f results/acronyms.tsv ] && [ -f repo/tests/conversion/acronyms.tsv ]; then
            python3 repo/tools/score_proper_nouns.py sentences repo/tests/conversion/acronyms.tsv results/acronyms.tsv "略語の文" > results/acronyms-score.txt
            head -14 results/acronyms-score.txt
          fi
          if [ -f results/acronyms-ja.tsv ] && [ -f repo/tests/conversion/acronyms-ja.tsv ]; then
            python3 repo/tools/score_proper_nouns.py sentences repo/tests/conversion/acronyms-ja.tsv results/acronyms-ja.tsv "略語と重なる日本語の文（日本語のまま出るのが正解）" > results/acronyms-ja-score.txt
            head -40 results/acronyms-ja-score.txt
          fi
          if [ -f results/acronyms-cand.tsv ] && [ -f repo/tests/conversion/acronyms-cand.tsv ]; then
            python3 repo/tools/score_proper_nouns.py candidates repo/tests/conversion/acronyms-cand.tsv results/acronyms-cand.tsv "略語の候補" > results/acronyms-cand-score.txt
            head -26 results/acronyms-cand-score.txt
          fi
          # ja400.json の話し言葉の区分（colloquial）の結果。話し言葉の打ち込み試験（組 h）と並べて見る
          if [ -f results/ja400.tsv ]; then
            python3 repo/tools/score_categories.py results/ja400.tsv repo/tests/conversion/ja400.json > results/ja400-score.txt
            grep -E "^colloquial|^合計" results/ja400-score.txt | head -3
          fi
          # 話し言葉の打ち込み試験（組 h）の採点: 厳しい採点と、記号・かな漢字の揺れを許す緩い採点
          if [ -f results/colloquial.tsv ] && [ -f repo/tests/conversion/colloquial.tsv ]; then
            python3 -m venv venv && venv/bin/pip -q install "sudachipy==0.6.11" "sudachidict-core==20260428"
            venv/bin/python repo/tools/score_colloquial.py repo/tests/conversion/colloquial.tsv results/colloquial.tsv "話し言葉の打ち込み" > results/colloquial-score.txt
            head -9 results/colloquial-score.txt
          fi
          # 人工知能の時間の上限に当たった回数（全部の組の合計。わざと遅くする組 i の slow- は除く）
          python3 repo/tools/zenzai_stats.py results --exclude slow- --label "全部の組" | tee results/zenzai-deadline-stats.txt
          [ -f results/slow-compare.txt ] && cat results/slow-compare.txt results/slow-ctx.txt results/slow-stats.txt results/slow-time.txt
          # 落ちないかの試験（組 j）
          [ -f results/stress.txt ] && cat results/stress.txt
          ls results
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.variant == 'cand' && 'linux-results-cand' || 'linux-results' }}
          path: results/
          if-no-files-found: ignore
