# Linux で組み立てて、変換の一括試験（1,298 文と正解つき 270 文）を流す。
# 実験用の枝（exp/…）への push か、手動で動く。結果は成果物として残る。
name: Linux test

on:
  push:
    branches: ['exp/**']
  workflow_dispatch:
    inputs:
      model_release:
        description: 人工知能を差し替えて比べるときの、下書きの配布ページの目印（例 model-ft-v1）。空なら公式の人工知能
        default: ''
      model_file:
        description: その配布ページのファイル名（例 zenz-v3.2-small-ft-v1-Q5_K_M.gguf）
        default: ''

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    env:
      USE_BAZEL_VERSION: 9.0.2
    steps:
      - uses: actions/checkout@v4
        with:
          path: repo

      - name: 道具
        run: |
          set -eo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang cmake ninja-build lld libcurl4-openssl-dev libncurses-dev libxml2-dev libz3-dev python3-venv > /dev/null
          mkdir -p $HOME/tools && ln -sf $(command -v ld.lld) $HOME/tools/ld.lld
          curl -fsSL -o $HOME/tools/bazelisk https://github.com/bazelbuild/bazelisk/releases/download/v1.25.0/bazelisk-linux-amd64
          chmod +x $HOME/tools/bazelisk
          curl -fsSL -o /tmp/swift.tar.gz https://download.swift.org/swift-6.3.3-release/ubuntu2404/swift-6.3.3-RELEASE/swift-6.3.3-RELEASE-ubuntu24.04.tar.gz
          mkdir -p $HOME/swift && tar -xzf /tmp/swift.tar.gz -C $HOME/swift --strip-components=1 && rm /tmp/swift.tar.gz
          $HOME/swift/usr/bin/swift --version

      - name: 上流のソースと土台の改修
        run: |
          set -eo pipefail
          W=$GITHUB_WORKSPACE
          git clone -q https://github.com/unok/myime.git myime
          git -C myime checkout -q a8486eca5312556ff88fed7f1850a28843b67977
          git -C myime submodule update -q --init --recursive
          git -C myime/mozc apply --whitespace=nowarn $W/repo/patches/mozc-base.patch
          git -C myime apply --whitespace=nowarn $W/repo/patches/myime-engine.patch
          git init -q llama.cpp && cd llama.cpp && git remote add origin https://github.com/fkunn1326/llama.cpp.git
          git fetch -q --depth 1 origin 10131b23ee0dbd9d03dfc618cec9fe3402919277 && git checkout -q FETCH_HEAD
          git apply --ignore-whitespace $W/repo/patches/llama-utf8.patch

      # 組み立ての途中の結果を次の試験で使い回す（変えた所だけ組み立て直す）
      - uses: actions/cache@v4
        with:
          path: |
            ~/bazel-disk
            ~/bazel-repo
          key: linux-bazel-${{ github.run_id }}
          restore-keys: linux-bazel-
      - uses: actions/cache@v4
        with:
          path: |
            llama.cpp/build
            myime/src/swift-engine/.build
          key: linux-engine-${{ hashFiles('repo/patches/llama-utf8.patch', 'repo/patches/myime-engine.patch', 'repo/tools/apply_linux_engine_port.py', 'repo/tools/apply_selector_trace.py', 'repo/tools/apply_selector_stage3.py', 'repo/tools/apply_zenzai_deadline.py', 'repo/tools/swift-Package.resolved') }}

      - name: 生成器と改造の適用
        run: |
          set -eo pipefail
          W=$GITHUB_WORKSPACE; S=$W/myime/mozc/src
          python3 -m venv $W/venv && $W/venv/bin/pip -q install pillow
          PY=$W/venv/bin/python
          $PY $W/repo/tools/build_english_lexicon.py --out $W/lex
          mkdir -p $W/ut
          curl -fsSL -o $W/ut/mozcdic-ut-sudachidict.txt.bz2 \
            https://raw.githubusercontent.com/utuhiro78/mozcdic-ut-sudachidict/c686771bada1d59e9b105c81b29e6ac1a239cb54/mozcdic-ut-sudachidict.txt.bz2
          echo "d2cb4b2b16d513e257d26d1c33673ebda254a1d5aa0c3c0c9bc94f932619fbdc  $W/ut/mozcdic-ut-sudachidict.txt.bz2" | sha256sum -c
          bunzip2 -k $W/ut/mozcdic-ut-sudachidict.txt.bz2
          $PY $W/repo/tools/build_ut_dictionary.py --mozc $S --ut $W/ut --sources sudachidict --out $W/dictionary10.txt --install
          cp $W/repo/native/precision117/engine.cc $S/engine/engine.cc
          cp $W/repo/native/precision117/whole_surface_path_v2.h $S/engine/whole_surface_path_v2.h
          $PY $W/repo/tools/apply_jaen_integration.py $S $W/lex
          $PY $W/repo/tools/apply_linux_engine_port.py $W/myime/src
          # 選び手の段階2b: Zenzai の計算済みの分布の記録（MYIME_SELECTOR_FEATURES のときだけ動く）
          $PY $W/repo/tools/apply_selector_trace.py $W/myime/src
          # 選び手の段階3: 学習した選び手を組み込む（MYIME_SELECTOR=0 で切る）
          $PY $W/repo/tools/apply_selector_stage3.py $S $W/myime/src

      - name: llama.cpp と変換エンジン
        run: |
          set -eo pipefail
          W=$GITHUB_WORKSPACE; export PATH=$HOME/swift/usr/bin:$PATH
          cmake -S $W/llama.cpp -B $W/llama.cpp/build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=ON \
            -DGGML_NATIVE=OFF -DGGML_AVX2=ON -DGGML_FMA=ON -DGGML_F16C=ON -DLLAMA_CURL=OFF \
            -DLLAMA_BUILD_TESTS=OFF -DLLAMA_BUILD_EXAMPLES=OFF -DLLAMA_BUILD_SERVER=OFF > /dev/null
          cmake --build $W/llama.cpp/build > /dev/null
          cd $W/myime/src/swift-engine
          cp $W/repo/tools/swift-Package.resolved Package.resolved
          L=$W/llama.cpp/build/bin
          swift build -c release -Xlinker -L$L -Xlinker -lllama -Xlinker -lggml -Xlinker -lggml-base \
            -Xlinker -rpath -Xlinker '$ORIGIN' -Xswiftc -no-toolchain-stdlib-rpath 2>&1 | tail -3

      - name: Mozc（試験用ツール）
        run: |
          set -eo pipefail
          T=$HOME/tools; cd $GITHUB_WORKSPACE/myime/mozc/src
          $T/bazelisk build --config oss_linux -c opt --nocheck_visibility --disk_cache=$HOME/bazel-disk --repository_cache=$HOME/bazel-repo \
            --action_env=PATH=$T:/usr/bin:/bin --host_action_env=PATH=$T:/usr/bin:/bin \
            --linkopt=-B$T --host_linkopt=-B$T //session:session_handler_main > $GITHUB_WORKSPACE/bazel.log 2>&1 \
            || { grep -B3 -A20 "ERROR\|error:" $GITHUB_WORKSPACE/bazel.log | head -80; exit 1; }

      - name: 試験に使う一式をまとめる
        run: |
          set -eo pipefail
          W=$GITHUB_WORKSPACE; E=$W/bin/engine; mkdir -p $E
          R=$W/myime/src/swift-engine/.build/release
          cp $R/libazookey-engine.so $W/llama.cpp/build/bin/*.so $HOME/swift/usr/lib/swift/linux/*.so $E/
          cp -r $R/*.resources $E/
          cp $W/myime/mozc/src/bazel-bin/session/session_handler_main $E/

      - uses: actions/upload-artifact@v4
        with:
          name: linux-bin
          path: bin/
          retention-days: 1

      # 英単語の一覧（build_english_lexicon.py の出力）: ウィンドウズ版を手元で組み立てるときに使う
      - uses: actions/upload-artifact@v4
        with:
          name: english-lexicon
          path: lex/
          retention-days: 14

  # 選び手の段階2の材料集め（selector-data.yml）。exp/selector-stage2 の枝のときだけ。
  selector-data:
    needs: build
    if: github.ref_name == 'exp/selector-stage2'
    uses: ./.github/workflows/selector-data.yml

  # 試験を3つの組に分けて、別々の計算機で同時に流す（tools/run_tests.sh）
  # 選び手の材料集めの枝では、計算機を材料集めに回すため流さない。
  test:
    needs: build
    if: github.ref_name != 'exp/selector-stage2'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    # 下書きの配布ページ（公開しない、比べるための人工知能）を読むのに書き込みの権限が要る
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        group: [a1, a2, b, c, d1, d2, e1, e2, f, g, h, i, j]
    steps:
      - uses: actions/checkout@v4
        with:
          path: repo
      - uses: actions/download-artifact@v4
        with:
          name: linux-bin
          path: bin
      - name: 変換の試験（組 ${{ matrix.group }}）
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eo pipefail
          W=$GITHUB_WORKSPACE
          chmod +x $W/bin/engine/session_handler_main
          if [ -n "${{ inputs.model_release }}" ]; then
            # 比べるための人工知能（公開しない下書きの配布ページから）
            gh release download "${{ inputs.model_release }}" -R "$GITHUB_REPOSITORY" -p "${{ inputs.model_file }}" -O $W/model.gguf
            echo "差し替えた人工知能: ${{ inputs.model_file }}"
            sha256sum $W/model.gguf
          else
            curl -fsSL -o $W/model.gguf \
              https://github.com/J-KAMMA/compound-ime/releases/download/model-zenz-ft-v5/zenz-v3.2-small-ft-v5-mix-Q5_K_M.gguf
            echo "2f9d9d9679dbd3b38ebd48f402369cc1c66f709bfcf83d70d87ca3353e541fff  $W/model.gguf" | sha256sum -c
          fi
          bash $W/repo/tools/run_tests.sh ${{ matrix.group }} $W/bin/engine $W/model.gguf $W/repo $W/results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results-${{ matrix.group }}
          path: results/
          if-no-files-found: ignore

  # 組の結果を1つにまとめる（名前は今までと同じ linux-results）
  results:
    needs: test
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          path: repo
      - uses: actions/download-artifact@v4
        with:
          pattern: results-*
          path: results
          merge-multiple: true
      - name: 1,298文と打ち方の揺れの前半と後半をつなぐ
        run: |
          if [ -f results/inputs-1.tsv ] && [ -f results/inputs-2.tsv ]; then
            cat results/inputs-1.tsv results/inputs-2.tsv > results/inputs.tsv && rm results/inputs-1.tsv results/inputs-2.tsv
          fi
          if [ -f results/variants-1.tsv ] && [ -f results/variants-2.tsv ]; then
            cat results/variants-1.tsv results/variants-2.tsv > results/variants.tsv && rm results/variants-1.tsv results/variants-2.tsv
            python3 repo/tools/score_variants.py repo/tests/conversion/variants.tsv results/variants.tsv | tee results/variants-score.txt | head -40
          fi
          # 選び手の段階0: 候補の上位8つから正解を組める間違いの数（tools/selector_ceiling.py）
          if ls results/dump-*.txt > /dev/null 2>&1; then
            curl -fsSL -o romanji-hiragana.tsv \
              https://raw.githubusercontent.com/unok/mozc/2d993fd532c0df849ff3a5f6c7851b3757471ed6/src/data/preedit/romanji-hiragana.tsv
            echo "fcb900e311d32ced05499c86e236d1084fb0c0937398deb6311fc6c7287a7821  romanji-hiragana.tsv" | sha256sum -c
            for n in ja400 jaen270 jaen200b; do
              [ -f results/dump-$n.txt ] && python3 repo/tools/selector_ceiling.py results/dump-$n.txt results/$n.tsv \
                repo/tests/conversion/$n.json romanji-hiragana.tsv > results/ceiling-$n.txt && head -14 results/ceiling-$n.txt
            done
          fi
          # 選び手の段階1: Zenz の尤度だけで選べるか（tools/selector_stage1.py）
          for n in ja400 jaen200b; do
            [ -f results/score-$n.txt ] && python3 repo/tools/selector_stage1.py results/score-$n.txt results/$n.tsv \
              repo/tests/conversion/$n.json > results/stage1-$n.txt && head -8 results/stage1-$n.txt
          done
          if [ -f results/wiki-typing-1.tsv ] && [ -f results/wiki-typing-2.tsv ]; then
            cat results/wiki-typing-1.tsv results/wiki-typing-2.tsv > results/wiki-typing.tsv && rm results/wiki-typing-1.tsv results/wiki-typing-2.tsv
            python3 repo/tools/score_wiki_typing.py repo/tests/conversion/wiki-typing.tsv results/wiki-typing.tsv | tee results/wiki-typing-score.txt | head -40
          fi
          # 分野の打ち込み試験（プログラミング、仮想通貨）の採点
          for f in prog crypto; do
            if [ -f results/domain-$f.tsv ] && [ -f repo/tests/conversion/domain-$f.tsv ]; then
              case $f in prog) label="分野の打ち込み（プログラミング）";; *) label="分野の打ち込み（仮想通貨）";; esac
              python3 repo/tools/score_wiki_typing.py repo/tests/conversion/domain-$f.tsv results/domain-$f.tsv "$label" > results/domain-$f-score.txt
              head -12 results/domain-$f-score.txt
            fi
          done
          # ja400.json の話し言葉の区分（colloquial）の結果。話し言葉の打ち込み試験（組 h）と並べて見る
          if [ -f results/ja400.tsv ]; then
            python3 repo/tools/score_categories.py results/ja400.tsv repo/tests/conversion/ja400.json > results/ja400-score.txt
            grep -E "^colloquial|^合計" results/ja400-score.txt | head -3
          fi
          # 話し言葉の打ち込み試験（組 h）の採点: 厳しい採点と、記号・かな漢字の揺れを許す緩い採点
          if [ -f results/colloquial.tsv ] && [ -f repo/tests/conversion/colloquial.tsv ]; then
            python3 -m venv venv && venv/bin/pip -q install "sudachipy==0.6.11" "sudachidict-core==20260428"
            venv/bin/python repo/tools/score_colloquial.py repo/tests/conversion/colloquial.tsv results/colloquial.tsv "話し言葉の打ち込み" > results/colloquial-score.txt
            head -9 results/colloquial-score.txt
          fi
          # 人工知能の時間の上限に当たった回数（全部の組の合計。わざと遅くする組 i の slow- は除く）
          python3 repo/tools/zenzai_stats.py results --exclude slow- --label "全部の組" | tee results/zenzai-deadline-stats.txt
          [ -f results/slow-compare.txt ] && cat results/slow-compare.txt results/slow-ctx.txt results/slow-stats.txt results/slow-time.txt
          # 落ちないかの試験（組 j）
          [ -f results/stress.txt ] && cat results/stress.txt
          ls results
      - uses: actions/upload-artifact@v4
        with:
          name: linux-results
          path: results/
          if-no-files-found: ignore
