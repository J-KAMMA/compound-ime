# Linux で組み立てて、変換の一括試験（1,298 文と正解つき 270 文）を流す。
# 実験用の枝（exp/…）への push か、手動で動く。結果は成果物として残る。
name: Linux test

on:
  push:
    branches: ['exp/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    env:
      USE_BAZEL_VERSION: 9.0.2
    steps:
      - uses: actions/checkout@v4
        with:
          path: repo

      - name: 道具
        run: |
          set -eo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang cmake ninja-build lld libcurl4-openssl-dev libncurses-dev libxml2-dev libz3-dev python3-venv > /dev/null
          mkdir -p $HOME/tools && ln -sf $(command -v ld.lld) $HOME/tools/ld.lld
          curl -fsSL -o $HOME/tools/bazelisk https://github.com/bazelbuild/bazelisk/releases/download/v1.25.0/bazelisk-linux-amd64
          chmod +x $HOME/tools/bazelisk
          curl -fsSL -o /tmp/swift.tar.gz https://download.swift.org/swift-6.3.3-release/ubuntu2404/swift-6.3.3-RELEASE/swift-6.3.3-RELEASE-ubuntu24.04.tar.gz
          mkdir -p $HOME/swift && tar -xzf /tmp/swift.tar.gz -C $HOME/swift --strip-components=1 && rm /tmp/swift.tar.gz
          $HOME/swift/usr/bin/swift --version

      - name: 上流のソースと土台の改修
        run: |
          set -eo pipefail
          W=$GITHUB_WORKSPACE
          git clone -q https://github.com/unok/myime.git myime
          git -C myime checkout -q a8486eca5312556ff88fed7f1850a28843b67977
          git -C myime submodule update -q --init --recursive
          git -C myime/mozc apply --whitespace=nowarn $W/repo/patches/mozc-base.patch
          git -C myime apply --whitespace=nowarn $W/repo/patches/myime-engine.patch
          git init -q llama.cpp && cd llama.cpp && git remote add origin https://github.com/fkunn1326/llama.cpp.git
          git fetch -q --depth 1 origin 10131b23ee0dbd9d03dfc618cec9fe3402919277 && git checkout -q FETCH_HEAD
          git apply --ignore-whitespace $W/repo/patches/llama-utf8.patch

      - name: 生成器と改造の適用
        run: |
          set -eo pipefail
          W=$GITHUB_WORKSPACE; S=$W/myime/mozc/src
          python3 -m venv $W/venv && $W/venv/bin/pip -q install pillow
          PY=$W/venv/bin/python
          $PY $W/repo/tools/build_english_lexicon.py --out $W/lex
          mkdir -p $W/ut
          curl -fsSL -o $W/ut/mozcdic-ut-sudachidict.txt.bz2 \
            https://raw.githubusercontent.com/utuhiro78/mozcdic-ut-sudachidict/c686771bada1d59e9b105c81b29e6ac1a239cb54/mozcdic-ut-sudachidict.txt.bz2
          echo "d2cb4b2b16d513e257d26d1c33673ebda254a1d5aa0c3c0c9bc94f932619fbdc  $W/ut/mozcdic-ut-sudachidict.txt.bz2" | sha256sum -c
          bunzip2 -k $W/ut/mozcdic-ut-sudachidict.txt.bz2
          $PY $W/repo/tools/build_ut_dictionary.py --mozc $S --ut $W/ut --sources sudachidict --out $W/dictionary10.txt --install
          cp $W/repo/native/precision117/engine.cc $S/engine/engine.cc
          cp $W/repo/native/precision117/whole_surface_path_v2.h $S/engine/whole_surface_path_v2.h
          $PY $W/repo/tools/apply_jaen_integration.py $S $W/lex
          $PY $W/repo/tools/apply_linux_engine_port.py $W/myime/src

      - name: llama.cpp と変換エンジン
        run: |
          set -eo pipefail
          W=$GITHUB_WORKSPACE; export PATH=$HOME/swift/usr/bin:$PATH
          cmake -S $W/llama.cpp -B $W/llama.cpp/build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=ON \
            -DGGML_NATIVE=OFF -DGGML_AVX2=ON -DGGML_FMA=ON -DGGML_F16C=ON -DLLAMA_CURL=OFF \
            -DLLAMA_BUILD_TESTS=OFF -DLLAMA_BUILD_EXAMPLES=OFF -DLLAMA_BUILD_SERVER=OFF > /dev/null
          cmake --build $W/llama.cpp/build > /dev/null
          cd $W/myime/src/swift-engine
          cp $W/repo/tools/swift-Package.resolved Package.resolved
          L=$W/llama.cpp/build/bin
          swift build -c release -Xlinker -L$L -Xlinker -lllama -Xlinker -lggml -Xlinker -lggml-base \
            -Xlinker -rpath -Xlinker '$ORIGIN' -Xswiftc -no-toolchain-stdlib-rpath 2>&1 | tail -3

      - name: Mozc（試験用ツール）
        run: |
          set -eo pipefail
          T=$HOME/tools; cd $GITHUB_WORKSPACE/myime/mozc/src
          $T/bazelisk build --config oss_linux -c opt --nocheck_visibility \
            --action_env=PATH=$T:/usr/bin:/bin --host_action_env=PATH=$T:/usr/bin:/bin \
            --linkopt=-B$T --host_linkopt=-B$T //session:session_handler_main > $GITHUB_WORKSPACE/bazel.log 2>&1 \
            || { grep -B3 -A20 "ERROR\|error:" $GITHUB_WORKSPACE/bazel.log | head -80; exit 1; }

      - name: 変換の一括試験
        run: |
          set -eo pipefail
          W=$GITHUB_WORKSPACE; E=$W/engine; mkdir -p $E
          R=$W/myime/src/swift-engine/.build/release
          cp $R/libazookey-engine.so $W/llama.cpp/build/bin/*.so $HOME/swift/usr/lib/swift/linux/*.so $E/
          cp -r $R/*.resources $E/
          cp $W/myime/mozc/src/bazel-bin/session/session_handler_main $E/
          curl -fsSL -o $W/model.gguf \
            https://huggingface.co/Miwa-Keita/zenz-v3.2-small-gguf/resolve/c67e03e07d215c869f591b274c1631170d3e11fe/ggml-model-Q5_K_M.gguf
          echo "29c223d4c23327b80fd13ebb5ab2555057a46317997d5da391584ffbef0db673  $W/model.gguf" | sha256sum -c
          T=$W/repo/tests/conversion; mkdir -p $W/results
          bash $W/repo/tools/batch_convert.sh $E/session_handler_main $E $W/model.gguf $T/jaen270.txt $W/results/jaen270.tsv 4
          python3 -c "import json,sys; print('\n'.join(i['romaji'] for i in json.load(open(sys.argv[1]))['items']))" $T/jaen200b.json > $W/jaen200b.txt
          bash $W/repo/tools/batch_convert.sh $E/session_handler_main $E $W/model.gguf $W/jaen200b.txt $W/results/jaen200b.tsv 4
          python3 -c "import json,sys; print('\n'.join(i['romaji'] for i in json.load(open(sys.argv[1]))['items']))" $T/typo150.json > $W/typo150.txt
          bash $W/repo/tools/batch_convert.sh $E/session_handler_main $E $W/model.gguf $W/typo150.txt $W/results/typo150.tsv 4
          # 打ち間違いの直しを見ずに作った別の150文: 直しなし（off）と既定の両方
          python3 -c "import json,sys; print('\n'.join(i['romaji'] for i in json.load(open(sys.argv[1]))['items']))" $T/typo150b.json > $W/typo150b.txt
          MYIME_TYPO_MARGIN=off bash $W/repo/tools/batch_convert.sh $E/session_handler_main $E $W/model.gguf $W/typo150b.txt $W/results/typo150b-off.tsv 4
          bash $W/repo/tools/batch_convert.sh $E/session_handler_main $E $W/model.gguf $W/typo150b.txt $W/results/typo150b.tsv 4
          # 日本語だけの400文（同音異義語、活用、敬語、数、固有名、カタカナ語、話し言葉、長文、助詞、慣用句）
          python3 -c "import json,sys; print('\n'.join(i['romaji'] for i in json.load(open(sys.argv[1]))['items']))" $T/ja400.json > $W/ja400.txt
          bash $W/repo/tools/batch_convert.sh $E/session_handler_main $E $W/model.gguf $W/ja400.txt $W/results/ja400.tsv 4
          python3 $W/repo/tools/score_categories.py $W/results/ja400.tsv $T/ja400.json | head -12
          # 候補の先頭4つ: カタカナ語の次の英単語、日付・時刻（きょう、いま）、絵文字（ねこ）、話し言葉
          for r in konpyu-ta- ko-hi- kafe cafe idea yoga mi-thinngu sukeju-ru ribinngu kyou ima ashita neko hare ikokka; do
            printf 'SEND_KEY\tON\nSEND_KEYS\t%s\nSEND_KEY\tSpace\nSHOW_OUTPUT\n' "$r" > $W/cand.tsv
            MYIME_HERMETIC_TEST=1 MYIME_AZOOKEY_DLL_DIR=$E MYIME_AZOOKEY_ZENZAI_WEIGHT=$W/model.gguf TEST_TMPDIR=$W/cp $E/session_handler_main --input $W/cand.tsv --profile $W/cp --dictionary oss < /dev/null 2>/dev/null \
              | awk '/^ *candidates \{/{c=1} c&&/^ *value:/{v=$0; sub(/.*value: "/,"",v); sub(/"$/,"",v); out=out v " / "; n++} n>=8{exit} END{print out}' | sed "s|^|$r: |" || true
          done
          # 利用者が見つけた失敗（毎回確かめる）
          python3 -c "import json,sys; print('\n'.join(i['romaji'] for i in json.load(open(sys.argv[1]))['items']))" $T/reported.json > $W/reported.txt
          bash $W/repo/tools/batch_convert.sh $E/session_handler_main $E $W/model.gguf $W/reported.txt $W/results/reported.tsv 1
          python3 $W/repo/tools/score_categories.py $W/results/reported.tsv $T/reported.json
          bash $W/repo/tools/batch_convert.sh $E/session_handler_main $E $W/model.gguf $T/inputs.txt $W/results/inputs.tsv 4
          python3 $W/repo/tools/compare_results.py $T/expected-windows-139.tsv $W/results/inputs.tsv | head -60

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-results
          path: results/
          if-no-files-found: ignore
